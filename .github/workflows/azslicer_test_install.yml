name: AZSlicer install test

# Installs a built AZSlicer on a clean Windows runner, starts it, takes screenshots
# and checks the installed files. Results are committed to the "test-results" branch.

on:
  push:
    branches: [ ci-test ]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of the 'AZSlicer Windows' build to test"
        required: false

permissions:
  contents: write
  actions: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Find build to test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $id = '${{ inputs.run_id }}'
          if (-not $id) {
            $id = gh api "repos/${{ github.repository }}/actions/workflows/azslicer_windows.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id'
          }
          "BUILD_RUN_ID=$id" | Out-File $env:GITHUB_ENV -Append
          "build run: $id" | Out-File $env:RUNNER_TEMP\build.txt

      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: AZSlicer_Windows_V2.6.0-dev_x64
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}
          path: installer

      - name: Prepare
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-Content $env:RUNNER_TEMP\build.txt | Out-File out/notes.txt
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { "resolution: $_" | Out-File out/notes.txt -Append }
          Get-ChildItem -Recurse installer | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300 | Out-File out/installer_files.txt

      - name: Silent install
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse installer -Filter *.exe | Select-Object -First 1
          "installer: $($exe.Name)" | Out-File out/notes.txt -Append
          $p = Start-Process $exe.FullName -ArgumentList '/S' -PassThru -Wait
          "installer exit code: $($p.ExitCode)" | Out-File out/notes.txt -Append
          $roots = @("$env:ProgramFiles\AZSlicer", "${env:ProgramFiles(x86)}\AZSlicer")
          $dir = $roots | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $dir) { $dir = (Get-ChildItem $env:ProgramFiles -Directory | Where-Object Name -like '*AZ*' | Select-Object -First 1).FullName }
          "install dir: $dir" | Out-File out/notes.txt -Append
          "INSTALL_DIR=$dir" | Out-File $env:GITHUB_ENV -Append
          Get-ChildItem $dir | Select-Object Name, Length | Format-Table -AutoSize | Out-String -Width 300 | Out-File out/install_dir.txt
          $ErrorActionPreference = 'Continue'
          $lnk = @("$env:ProgramData\Microsoft\Windows\Start Menu\Programs", "$env:APPDATA\Microsoft\Windows\Start Menu\Programs", "$env:PUBLIC\Desktop", "$env:USERPROFILE\Desktop") |
            ForEach-Object { Get-ChildItem $_ -Recurse -Filter *.lnk -ErrorAction SilentlyContinue } | Where-Object FullName -match 'AZSlicer|Orca'
          $sh = New-Object -ComObject WScript.Shell
          $lnk | ForEach-Object { "$($_.FullName) -> $($sh.CreateShortcut($_.FullName).TargetPath)" } | Out-File out/start_menu.txt
          Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -match 'AZSlicer|Orca' } | Select-Object DisplayName, DisplayVersion, Publisher, DisplayIcon, UninstallString | Format-List | Out-String -Width 300 | Out-File out/uninstall_entry.txt
          foreach ($f in 'orca-slicer.exe', 'OrcaSlicer.dll') {
            "== $f" | Out-File out/exe_version.txt -Append
            (Get-Item "$dir\$f").VersionInfo | Format-List CompanyName, FileDescription, ProductName, ProductVersion, LegalCopyright | Out-String | Out-File out/exe_version.txt -Append
          }
          $snap = Get-ChildItem -LiteralPath "$dir\resources\profiles\Snapmaker" -Recurse -File -ErrorAction SilentlyContinue
          "Snapmaker files total: $($snap.Count)" | Out-File out/snapmaker_u1.txt
          Get-ChildItem -LiteralPath "$dir\resources\profiles\Snapmaker" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name | Out-File out/snapmaker_u1.txt -Append
          "json under profiles: $((Get-ChildItem -LiteralPath "$dir\resources\profiles" -Recurse -Filter *.json -ErrorAction SilentlyContinue).Count)" | Out-File out/snapmaker_u1.txt -Append
          $u1 = $snap | Where-Object Name -like '*U1*'
          "Snapmaker U1 files: $($u1.Count)" | Out-File out/snapmaker_u1.txt -Append
          $u1 | Where-Object FullName -match 'machine' | Select-Object -ExpandProperty FullName | Out-File out/snapmaker_u1.txt -Append
          Get-ChildItem "$dir\resources" -Directory | Select-Object -ExpandProperty Name | Out-File out/resources_dirs.txt
          Get-ChildItem "$dir\resources" -Recurse -Filter *.mo -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName | Select-Object -First 5 | Out-File out/i18n.txt
          exit 0

      - name: Software OpenGL (runner has no GPU)
        shell: pwsh
        continue-on-error: true
        run: |
          # Mesa llvmpipe so the app can open its 3D view on a GPU-less runner (test only, not shipped).
          $rel = Invoke-RestMethod https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest -Headers @{ Authorization = "Bearer ${{ github.token }}" }
          $asset = $rel.assets | Where-Object name -match 'release-msvc\.7z$' | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile mesa.7z
          7z x mesa.7z -omesa -y | Out-Null
          Copy-Item mesa\x64\opengl32.dll, mesa\x64\libgallium_wgl.dll, mesa\x64\libglapi.dll "$env:INSTALL_DIR" -ErrorAction SilentlyContinue
          "mesa: $($rel.tag_name)" | Out-File out/notes.txt -Append

      - name: Run app and take screenshots
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 6
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("out/$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          $env:GALLIUM_DRIVER = 'llvmpipe'
          $app = Get-ChildItem $env:INSTALL_DIR -Filter *.exe | Where-Object Name -notmatch 'uninst|gcodeviewer' | Select-Object -First 1
          $p = Start-Process $app.FullName -PassThru
          foreach ($t in 3, 8, 15, 30, 60, 90, 120) {
            Start-Sleep -Seconds ($t - ($(if ($prev) { $prev } else { 0 })))
            $prev = $t
            Shot ("shot_{0:D3}s" -f $t)
          }
          "process alive after 120s: $(-not $p.HasExited)" | Out-File out/notes.txt -Append
          Add-Type @'
          using System; using System.Runtime.InteropServices;
          public static class M { [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(int f, int x, int y, int d, int e);
            public static void Click(int x, int y) { SetCursorPos(x, y); mouse_event(2,0,0,0,0); mouse_event(4,0,0,0,0); } }
          '@
          [M]::Click(959, 663); Start-Sleep 12; Shot 'wizard_after_get_started'
          $sys = "$env:APPDATA\AZSlicer\system"
          "system dir json: $((Get-ChildItem $sys -Recurse -Filter *.json -ErrorAction SilentlyContinue).Count)" | Out-File out/snapmaker_u1.txt -Append
          Get-ChildItem $sys -Recurse -Filter '*U1*' -ErrorAction SilentlyContinue | Select-Object -First 10 -ExpandProperty FullName | Out-File out/snapmaker_u1.txt -Append
          Get-Process | Where-Object { $_.MainWindowTitle } | Select-Object ProcessName, MainWindowTitle | Format-Table -AutoSize | Out-String -Width 300 | Out-File out/windows.txt
          if (Test-Path "$env:APPDATA\AZSlicer") { Get-ChildItem "$env:APPDATA\AZSlicer" | Select-Object Name | Out-String | Out-File out/appdata.txt }
          else { "no %APPDATA%\AZSlicer" | Out-File out/appdata.txt }
          Get-ChildItem $env:APPDATA -Directory | Where-Object Name -match 'Orca|AZ' | Select-Object Name | Out-String | Out-File out/appdata.txt -Append
          $log = Get-ChildItem "$env:APPDATA\AZSlicer\log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($log) { Get-Content $log.FullName -Tail 80 | Out-File out/app_log_tail.txt }
          Get-Process orca-slicer, msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          exit 0

      - name: Publish results to test-results branch
        if: always()
        shell: pwsh
        run: |
          git config --global user.name "AZSlicer CI"
          git config --global user.email "actions@users.noreply.github.com"
          git init results; Copy-Item out\* results\ -Recurse
          cd results
          git checkout -b test-results
          git add -A
          git commit -m "Install test of build run $env:BUILD_RUN_ID"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" test-results
